<title>VamFit Gym Card</title>

<style>
/* Layout: one-handed gym view — sticky date bar + day strip, then one big row per exercise (name, sets, weight, tick). Food + rules fold away below. */
:root {
  --bg: #eef2f1; --panel: #ffffff; --ink: #142019; --muted: #5a6865; --line: #d6dfdc; --soft: #f4f8f7;
  --accent: #0d7a69; --accent-ink: #ffffff; --accent-soft: #dcf1ec; --anchor: #9a520a; --anchor-soft: #fbecd9; --warn: #a33b2b; --warn-soft: #fbe7e3;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1311; --panel: #151e1b; --ink: #e6eeeb; --muted: #9aaaa5; --line: #27332f; --soft: #1a2420;
  --accent: #3cbfa4; --accent-ink: #052019; --accent-soft: #12302a; --anchor: #f0a54f; --anchor-soft: #39270f; --warn: #f0907f; --warn-soft: #3a1c17; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1311; --panel: #151e1b; --ink: #e6eeeb; --muted: #9aaaa5; --line: #27332f; --soft: #1a2420;
  --accent: #3cbfa4; --accent-ink: #052019; --accent-soft: #12302a; --anchor: #f0a54f; --anchor-soft: #39270f; --warn: #f0907f; --warn-soft: #3a1c17; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.35;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 0 32px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
a { color: var(--accent) }
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 12px }

header { display: grid; gap: 8px }

.bar h1 { font-family: var(--display); font-weight: 700; font-size: clamp(1.25rem, 6vw, 1.7rem); margin: 0; flex: 1; min-width: 0; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.bar h1 small { display: block; font-family: var(--mono); font-size: .72rem; font-weight: 500; color: var(--muted) }
button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; cursor: pointer }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.nav { width: 44px; height: 44px; font-size: 1.4rem }

ol.moves { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }
li.mv { display: grid; grid-template-columns: 26px 1fr 48px; gap: 10px; align-items: center; padding: 12px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--soft) }
li.mv .n { font-family: var(--mono); font-weight: 600; color: var(--muted); text-align: center; font-size: .95rem }

details > summary::-webkit-details-marker { display: none }
details > summary::after { content: "+"; color: var(--accent); font-size: 1.5rem }
details[open] > summary::after { content: "−" }
.note { color: var(--muted); font-size: .85rem; margin: 0 }
.days button.moved { background: var(--accent-soft) }
.days button.moved span::after { content: " ✓"; color: var(--accent) }

.days button[aria-current="date"].moved span::after { color: var(--accent-ink) }

.job { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-weight: 700; font-size: 1.05rem; line-height: 1.25 }

.run { display: grid; gap: 4px; background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-weight: 600 }
.run span { display: block }
.officeline { font-family: var(--mono); font-size: .8rem; color: var(--muted) }

.set label { display: grid; gap: 4px; font-size: .9rem; color: var(--muted) }

.set .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }

.set .wk input { width: auto; min-height: 0 }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px }
.btnrow button, .btnrow label.btn { min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); font-weight: 600; cursor: pointer }
.btnrow .primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.saved { color: var(--accent); font-weight: 700; min-height: 1.2em }
.gymtog { width: 100%; min-height: 58px; font-size: 1.08rem; font-weight: 700; border-radius: 14px; border: 2px dashed var(--line); background: var(--panel) }
.gymtog.on { border: 2px solid var(--accent); background: var(--accent-soft); color: var(--ink) }
.mhead { display: flex; align-items: center; gap: 8px }
.mhead h2 { flex: 1; text-align: center }
.mgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px }
.mgrid .wd { font-family: var(--mono); font-size: .7rem; color: var(--muted); text-align: center }
.mc { position: relative; min-height: 56px; padding: 5px 2px; display: grid; align-content: start; justify-items: center; gap: 4px; border-radius: 8px }
.mc.out { opacity: .35 }
.mc.today { border: 2px solid var(--accent) }
.mc b { font-family: var(--display); font-size: 1.05rem }
.dots { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center }
.d { width: 8px; height: 8px; border-radius: 50%; display: inline-block }
.d.work { background: #4a7fd6 } .d.family { background: #b36ad1 } .d.fit { background: var(--accent) } .d.dl { background: #e08a2e }
.went { position: absolute; top: 2px; right: 4px; font-style: normal; color: var(--accent); font-size: .8rem; font-weight: 800 }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: .82rem; color: var(--muted) }
.legend span { display: inline-flex; align-items: center; gap: 5px }
.mlist { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: .92rem }
#guide summary small { font-family: var(--mono); font-size: .75rem; font-weight: 500; color: var(--muted); text-transform: none }
.wx { font-family: var(--mono); font-size: .8rem; color: var(--muted); margin: 6px 0 0 }
ol.guide { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px }
ol.guide li { display: grid; grid-template-columns: 72px 1fr; gap: 8px; padding: 7px 8px; border-left: 4px solid var(--line); background: var(--soft); border-radius: 6px; font-size: .93rem; line-height: 1.25 }
ol.guide .gt { font-family: var(--mono); font-size: .8rem; color: var(--muted); padding-top: 1px }
ol.guide li.t-work { border-left-color: #4a7fd6 } ol.guide li.t-family { border-left-color: #b36ad1 }
ol.guide li.t-fit { border-left-color: var(--accent) } ol.guide li.t-food { border-left-color: #c9a227 }
ol.guide li.t-rest { border-left-color: var(--muted) } ol.guide li.t-dl { border-left-color: #e08a2e }
ol.guide li.now { outline: 2px solid var(--accent) }
ol.guide small { display: block; color: var(--muted); font-size: .82rem }
.card ul.plain { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 6px; font-size: .95rem }
</style>

<div class="wrap">
  <div class="bar">
    <button class="nav" id="prev" aria-label="Previous day">‹</button>
    <h1 id="dateTitle"><span id="dateText">Today</span><small id="weekChip">Week 1</small></h1>
    <button class="nav" id="next" aria-label="Next day">›</button>
    <button class="nav" id="cal" aria-label="Month calendar">📅</button>
    <button class="nav" id="gear" aria-label="Settings">⚙</button>
  </div>
  <header>
    <div class="days" id="days" aria-label="Days of this week"></div>
    <div class="score" id="score"></div>
  </header>
  <main class="wrap" id="main"></main>
</div>

<script>
const DATA = /*__DATA__*/null;
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const SHORT = ["M","T","W","T","F","S","S"];
const W1 = Date.UTC(2026, 9, 26), DAY = 86400000;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function chicagoToday() {
  const p = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Chicago", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  const [y, m, d] = p.split("-").map(Number); return Date.UTC(y, m - 1, d);
}
const TODAY = chicagoToday();
const fromHash = () => { const m = /^#d(\d{4})(\d{2})(\d{2})$/.exec(location.hash || ""); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null; };
let cur = fromHash() ?? TODAY;
const dow = t => (new Date(t).getUTCDay() + 6) % 7;
const weekOf = t => Math.max(1, Math.floor((t - dow(t) * DAY - W1) / (7 * DAY)) + 1);
const fmt = (t, o) => new Date(t).toLocaleDateString("en-US", Object.assign({ timeZone: "UTC" }, o));
const key = t => { const d = new Date(t); return `${d.getUTCFullYear()}${String(d.getUTCMonth() + 1).padStart(2, "0")}${String(d.getUTCDate()).padStart(2, "0")}`; };
const isDark = t => { const d = new Date(t), m = d.getUTCMonth() + 1; return m === 11 || m === 12 || m <= 2 || (m === 3 && d.getUTCDate() < 8); };
const loadDone = t => { try { return JSON.parse(localStorage.getItem("done" + key(t)) || "[]"); } catch (e) { return []; } };
const saveDone = (t, a) => { try { localStorage.setItem("done" + key(t), JSON.stringify(a)); } catch (e) {} };

const PLAN_START = Date.UTC(2026, 10, 2);
const GYM_DAYS = [0, 1, 2, 3, 4];
const dayData = t => DATA.weeks[(weekOf(t) - 1) % 8 + 1][DAYS[dow(t)]];
const countMoves = w => w.sections.reduce((a, s) => a + s.moves.length, 0);
const loadGym = t => { try { return localStorage.getItem("gym" + key(t)) === "1"; } catch (e) { return false; } };
const saveGym = (t, on) => { try { if (on) localStorage.setItem("gym" + key(t), "1"); else localStorage.removeItem("gym" + key(t)); } catch (e) {} };
const moved = t => loadDone(t).length > 0 || loadGym(t);
// A workout day counts once 2 moves (weekends: 1) besides the after-dinner walk, always the last move, are ticked.
const workoutDone = t => { if (loadGym(t)) return true; const walk = countMoves(dayData(t)); return loadDone(t).filter(n => n !== walk).length >= (dow(t) < 5 ? 2 : 1); };

const SPARKS = [
  "Nobody has ever finished a workout and wished they had stayed on the couch.",
  "The hard part is the next 10 minutes, not the next hour. Shoes on.",
  "You don't have to feel like it. The feeling shows up after the warm-up.",
  "The kids are learning what getting older looks like by watching you.",
  "One set counts. One walk counts. Zero is the only number that doesn't.",
  "You have handled far harder things this year than a leg press.",
  "An hour from now you'll either be done, or still thinking about it.",
  "Missed yesterday? It's over. Today is the only day you can train.",
  "This is the one hour of the day that is only yours.",
  "You at 60 is asking for exactly one thing: this session.",
  "Tired after work is rarely the kind a workout makes worse. Give it 10 minutes and see.",
  "Today's walk helps today's blood sugar. It works by bedtime.",
  "Send your challenge group a gym selfie today. Let them wonder.",
  "One miss is nothing. Just don't miss twice."
];
const loadWhy = () => { try { return localStorage.getItem("why") || ""; } catch (e) { return ""; } };
function sparkHtml(t) {
  const why = loadWhy();
  return `<section class="card"><p class="spark">${esc(SPARKS[Math.floor(t / DAY) % SPARKS.length])}</p>${why ? `<p class="mywhy">My why: ${esc(why)}</p>` : ""}</section>`;
}

const chicagoHour = () => +new Intl.DateTimeFormat("en-US", { timeZone: "America/Chicago", hour: "numeric", hourCycle: "h23" }).format(new Date());
function coachCard(t) {
  const h = chicagoHour(), today = t === TODAY, weekday = dow(t) < 5;
  const openWake = today && (h < 12 || h >= 19), openOffice = today && weekday && h >= 12 && h < 16;
  return `<section class="card"><details${openWake ? " open" : ""}><summary>Waking up</summary>
    <p class="note">The heavy feeling usually fades in 15–30 minutes. Never decide anything lying in bed.</p>
    <ul class="plain">
      <li><b>Start here: phone across the room.</b> Charge it by the yoga mat, so you must stand to stop the alarm. No snooze.</li>
      <li><b>Same 60 seconds:</b> every light on, cold water on your face, full glass of water. Face only, no cold shower with high BP.</li>
      <li><b>Night before:</b> mat out, clothes on it, video ready. TV off and phone out of the bedroom at 9:00.</li>
      <li><b>5-minute deal:</b> get on the mat and press play. You may stop after 5 minutes.</li>
      <li><b>Rename the alarm</b> to your own why. It's the first thing you read.</li></ul></details>
    ${weekday ? `<details${openOffice ? " open" : ""}><summary>After office</summary>
    <p class="note">Desk tired is mostly mental tired. Moving often helps it. The couch mostly doesn't.</p>
    <ul class="plain">
      <li><b>Start here: TV off, no couch.</b> Eat your snack in the kitchen. Change at the 3:50 alert.</li>
      <li><b>Start here: one song, only at 3:50.</b> It becomes your signal to leave.</li>
      <li><b>Parking lot rule:</b> your only job is to drive there and park. Still want to go home after 5 minutes? You can.</li>
      <li><b>Gym-only treat:</b> a podcast, songs or show you get only at the gym. Change it when it gets boring.</li>
      <li><b>Collect proof:</b> rate your energy 1–10 before and after. Note both on your phone.</li></ul></details>` : ""}</section>`;
}

// ---------------- Settings (saved in this browser; Export/Import as a file). The public page ships generic defaults only.
// Auto-sync key: arrives once as #k=..., kept on this device only, then removed from the address bar.
(function () {
  const m = /^#k=([A-Za-z0-9_-]{43})$/.exec(location.hash || "");
  try { if (m) { localStorage.setItem("vamfitKey", m[1]); history.replaceState(null, "", location.pathname + location.search); } } catch (e) {}
})();
const SETTINGS_KEY = "vamfitSettings";
const DEFAULTS = {
  v: 1,
  kid1: { name: "Kid 1", dropTime: "", pickupTime: "15:00", aDays: [], bDays: [], collegeStart: "" },
  kid2: { name: "Kid 2", schoolStart: "09:00", schoolEnd: "16:30", activities: "" },
  office: { minDays: 12, rule: "pickup", weekdays: [], arrive: "", leave: "14:30" },
  deadlines: "",
  location: { label: "Dallas area", lat: 32.78, lon: -96.8 },
  routine: { leaveHome: "06:30", wake: "05:00", yoga: "05:05", gymStart: "16:30", gymEnd: "17:45", snack: "15:30", dinner: "18:10",
             walk: "18:45", walkMin: 10, screensOff: "21:00", bed: "21:30" }
};
const merge = (d, s) => { const o = {}; for (const k in d) o[k] = (d[k] && typeof d[k] === "object" && !Array.isArray(d[k])) ? merge(d[k], (s || {})[k]) : ((s || {})[k] ?? d[k]); return o; };
function loadSettings() { try { return merge(DEFAULTS, JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}")); } catch (e) { return merge(DEFAULTS, {}); } }
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(S)); } catch (e) {} }
let S = loadSettings(), view = "day";
const toMin = hm => { const m = /^(\d{1,2}):(\d{2})$/.exec(hm || ""); return m ? +m[1] * 60 + +m[2] : null; };
const t12 = mins => { if (mins == null) return ""; const h = Math.floor(mins / 60) % 24, m = mins % 60; return `${(h + 11) % 12 + 1}:${String(m).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`; };
const T = hm => t12(toMin(hm));
const iso = t => { const d = new Date(t); return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}-${String(d.getUTCDate()).padStart(2, "0")}`; };
function schoolDay(t) {
  const k = S.kid1, d = iso(t);
  if (k.collegeStart && d >= k.collegeStart) return null;
  return k.aDays.includes(d) ? "A" : (k.bDays.includes(d) ? "B" : null);
}
function schoolRange() { const all = [...S.kid1.aDays, ...S.kid1.bDays].sort(); return all.length ? [all[0], all[all.length - 1]] : null; }
function isOfficeDay(t) {
  if (dow(t) > 4) return false;
  if (S.office.rule === "weekdays") return S.office.weekdays.includes(dow(t));
  return schoolDay(t) === "A";
}
function noSchoolWeekday(t) { const r = schoolRange(), d = iso(t); return !!r && dow(t) < 5 && d >= r[0] && d <= r[1] && !schoolDay(t) && !(S.kid1.collegeStart && d >= S.kid1.collegeStart); }
function officeMonthHtml(t) {

  const i = dow(t), d = DAYS[i], m = DATA.meals[d], isGym = GYM_DAYS.includes(i), next = DAYS[(i + 1) % 7];
  return `<section class="card"><details${open ? " open" : ""}><summary>Food · ${m.kcal.toLocaleString()} kcal / ${m.p} g</summary><table><tbody>
    ${d === "Friday" ? `<tr><td>5:10 AM</td><td>Optional weigh-in</td></tr>` : ""}
    <tr><td>5:40 AM</td><td>Ragi ganji + saunf water</td></tr>
    <tr><td>${T(S.routine.snack)}</td><td><b>Snack:</b> ${esc(m.snack)}</td></tr>
    <tr><td>${isGym ? T(S.routine.gymEnd) : "5:15 PM"}</td><td>Whey, 1 scoop</td></tr>
    <tr><td>${T(S.routine.dinner)}</td><td><b><a href="${esc(m.recipe)}" target="_blank" rel="noopener">${esc(m.dish)}</a></b><br>Your plate: ${esc(m.plate)}</td></tr>
    <tr><td>Tonight</td><td>Prep for ${next}: ${esc(DATA.meals[next].prep)}</td></tr></tbody></table></details></section>`;
}

function updateProgress() {
  const all = document.querySelectorAll("li.mv").length, d = document.querySelectorAll("li.mv.done").length;
  const f = document.getElementById("fill"), c = document.getElementById("count");
  if (f) f.style.width = (all ? 100 * d / all : 0) + "%";
  if (c) c.textContent = `${d} / ${all} done`;
}

function render() {
  const wk = weekOf(cur), di = dow(cur), monday = cur - di * DAY;
  document.getElementById("dateText").textContent = fmt(cur, { weekday: "short", month: "short", day: "numeric" });
  document.getElementById("weekChip").textContent = `${cur === TODAY ? "Today · " : ""}Week ${wk} · cycle ${(wk - 1) % 4 + 1}/4`;
  document.getElementById("days").innerHTML = DAYS.map((d, i) => {
    const t = monday + i * DAY;
    return `<button data-t="${t}" ${t === cur ? 'aria-current="date"' : ""} class="${t === TODAY ? "today" : ""}${moved(t) ? " moved" : ""}" aria-label="${d}"><b>${SHORT[i]}</b><span>${new Date(t).getUTCDate()}</span></button>`;
  }).join("");
  document.getElementById("score").innerHTML = scoreHtml(monday) + officeMonthHtml(cur);
  if (view === "settings") { document.getElementById("main").innerHTML = settingsHtml(); return; }
  if (view === "month") { document.getElementById("main").innerHTML = monthHtml(); return; }
  document.getElementById("main").innerHTML = gymToggleHtml(cur) + guideHtml(cur) + sparkHtml(cur) + coachCard(cur) + workoutCard(cur) + foodCard(cur, di >= 5) + rulesCard();
  updateProgress();
  try { history.replaceState(null, "", "#d" + key(cur)); } catch (e) {}
}
document.getElementById("days").addEventListener("click", e => { const b = e.target.closest("button[data-t]"); if (b) { cur = +b.dataset.t; render(); window.scrollTo(0, 0); } });
document.getElementById("prev").addEventListener("click", () => { cur -= DAY; render(); });
document.getElementById("next").addEventListener("click", () => { cur += DAY; render(); });
document.getElementById("main").addEventListener("click", e => {
  const b = e.target.closest(".tick"); if (!b) return;
  const li = b.closest("li.mv"), n = +li.dataset.n, on = !li.classList.contains("done");
  li.classList.toggle("done", on); b.setAttribute("aria-pressed", on);
  const s = new Set(loadDone(cur)); if (on) s.add(n); else s.delete(n); saveDone(cur, [...s]); updateProgress();
  const btn = document.querySelector(`#days button[data-t="${cur}"]`);
  if (btn) btn.classList.toggle("moved", moved(cur));
  document.getElementById("score").innerHTML = scoreHtml(cur - dow(cur) * DAY) + officeMonthHtml(cur);
  const al = document.querySelector(".alarm"); if (al && moved(cur)) al.remove();
});
document.getElementById("cal").addEventListener("click", () => { view = view === "month" ? "day" : "month"; render(); window.scrollTo(0, 0); });
document.getElementById("main").addEventListener("click", e => {
  const tog = e.target.closest("#gymTog");
  if (tog) {
    const on = !loadGym(cur); saveGym(cur, on);
    tog.classList.toggle("on", on); tog.setAttribute("aria-pressed", on); tog.textContent = on ? "✅ I went to the gym" : "💪 Did I go to the gym? Tap if yes";
    const btn = document.querySelector(`#days button[data-t="${cur}"]`); if (btn) btn.classList.toggle("moved", moved(cur));
    document.getElementById("score").innerHTML = scoreHtml(cur - dow(cur) * DAY) + officeMonthHtml(cur);
    const al = document.querySelector(".alarm"); if (al && moved(cur)) al.remove();
    return;
  }
  if (e.target.closest("#mPrev, #mNext")) { const c = new Date(cur); cur = Date.UTC(c.getUTCFullYear(), c.getUTCMonth() + (e.target.closest("#mNext") ? 1 : -1), 1); render(); return; }
  const cell = e.target.closest(".mc[data-t]");
  if (cell) { cur = +cell.dataset.t; view = "day"; render(); window.scrollTo(0, 0); }
});
document.getElementById("gear").addEventListener("click", () => { view = view === "settings" ? "day" : "settings"; render(); window.scrollTo(0, 0); });
document.getElementById("main").addEventListener("click", e => {
  const id = e.target.id;
  if (id === "doneS") { view = "day"; render(); window.scrollTo(0, 0); }
  else if (id === "exportS") {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: "application/json" }));
    a.download = "vamfit-settings.json"; document.body.appendChild(a); a.click(); a.remove();
  } else if (id === "resetS" && confirm("Reset all settings to the defaults on this device?")) { S = merge(DEFAULTS, {}); saveSettings(); render(); flashSaved("Reset ✓"); }
});
document.getElementById("main").addEventListener("change", e => {
  const el = e.target;
  if (el.id === "importS" && el.files && el.files[0]) {
    el.files[0].text().then(txt => { const o = JSON.parse(txt); if (!o || typeof o !== "object" || !o.kid1) throw new Error("bad file"); S = merge(DEFAULTS, o); saveSettings(); render(); flashSaved("Imported ✓"); })
      .catch(() => flashSaved("That file isn't a VamFit settings file."));
    return;
  }
  if (el.dataset.wd !== undefined) {
    const i = +el.dataset.wd, set = new Set(S.office.weekdays); if (el.checked) set.add(i); else set.delete(i);
    S.office.weekdays = [...set].sort(); saveSettings(); flashSaved("Saved ✓"); document.getElementById("score").innerHTML = scoreHtml(cur - dow(cur) * DAY) + officeMonthHtml(cur); return;
  }
  if (el.dataset.p) {
    let val = el.value;
    if (el.dataset.kind === "dates") val = [...new Set((val.match(/\d{4}-\d{2}-\d{2}/g) || []))].sort();
    else if (el.dataset.kind === "float") val = parseFloat(val) || 0;
    else if (el.type === "number") val = Math.max(0, parseInt(val, 10) || 0);
    else if (el.type === "text") val = val.trim();
    setPath(el.dataset.p, val); saveSettings(); flashSaved("Saved ✓");
    document.getElementById("score").innerHTML = scoreHtml(cur - dow(cur) * DAY) + officeMonthHtml(cur);
    if (el.dataset.kind === "dates") el.value = val.join(", ");
    return;
  }
  if (el.id !== "why") return;
  try { localStorage.setItem("why", e.target.value.trim()); } catch (err) {}
  render();
});
document.getElementById("main").addEventListener("toggle", e => { if (e.target.id === "guideD") try { localStorage.setItem("guideOpen", e.target.open ? "1" : "0"); } catch (err) {} }, true);
loadWx();
window.addEventListener("hashchange", () => { const h = fromHash(); if (h !== null && h !== cur) { cur = h; render(); } });
// Auto-sync: settings.enc.json is published next to the page (AES-GCM). A newer "rev" replaces this device's settings.
async function syncSettings() {
  let k = null; try { k = localStorage.getItem("vamfitKey"); } catch (e) {}
  if (!k || !window.crypto || !crypto.subtle) return;
  try {
    const r = await fetch("settings.enc.json?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) return;
    const f = await r.json(); const last = +(localStorage.getItem("vamfitRev") || 0); if (!(f.rev > last)) return;
    const b = x => { x = x.replace(/-/g, "+").replace(/_/g, "/"); while (x.length % 4) x += "="; return Uint8Array.from(atob(x), c => c.charCodeAt(0)); };
    const key = await crypto.subtle.importKey("raw", b(k), "AES-GCM", false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(f.iv) }, key, b(f.ct));
    S = merge(DEFAULTS, JSON.parse(new TextDecoder().decode(pt))); saveSettings();
    localStorage.setItem("vamfitRev", String(f.rev)); render(); loadWx();
  } catch (e) {}
}
syncSettings();
document.addEventListener("visibilitychange", () => { if (!document.hidden) syncSettings(); });
render();
</script>
